# The kit's own trailer gate.
#
# Adapted from templates/github-trailer-gate.yml, which checks out the kit at a pinned tag.
# This repository IS the kit, so it runs its own tooling from the checkout instead. That is
# the only difference; the contract is the same one every adopting project gets.
#
# WHAT THIS CANNOT SEE: on a squash-merge GitHub composes a new commit message at merge
# time from the PR title and body, editable in the merge dialog, and no CI run observes it
# before it lands. The push trigger is the mitigation -- it checks after the fact, so a bad
# squash turns main red immediately instead of quietly costing a task. Detection, not
# prevention.

# THE JOB NAMES BELOW ARE LOAD-BEARING. Branch protection on `main` requires these FIVE checks
# by name -- `structure`, `trailers`, `conformance (ubuntu-latest)`, `conformance (macos-latest)`
# and, since 2026-09-18, `conformance (windows-latest)`.
# A required check that never reports blocks every merge forever, so renaming a job, or changing
# the matrix so a leg reports under a different name, silently locks the branch until someone
# edits the protection rule to match. Rename here and there, in the same change, or not at all.
#
# The matrix names are composed by GitHub as `<job> (<matrix value>)` -- adding an OS adds a
# check that protection does not require, which is harmless; removing one leaves a required
# check with nothing to satisfy it, which is not.
#
# `conformance (windows-latest)` was added reporting-only and PROMOTED TO REQUIRED on
# 2026-09-18, after six green observations with no failure -- three consecutive on `main` and
# three on PRs -- following the two defects it was added to find. Removing it from protection
# is the escape hatch if it proves flaky, and takes seconds.

name: kit trailers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trailers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the merge base must be present, so no shallow clone

      - name: Validate commit trailers
        run: |
          set -eu
          if [ "${{ github.event_name }}" = pull_request ]; then
            RANGE='${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}'
          else
            BEFORE='${{ github.event.before }}'
            if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] \
               || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              RANGE='${{ github.sha }}~1..${{ github.sha }}'
            else
              RANGE="$BEFORE..${{ github.sha }}"
            fi
          fi
          echo "range: $RANGE"
          bash tooling/kit-trailers.sh range "$RANGE" --enforce

  # The kit's own verification ladder, from commands.* in .claude/project-profile.md.
  # Rungs 3 and 5 are declared unavailable there rather than faked, which raises the tier
  # instead of lowering the bar.
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The backlog check below runs kit-index.sh, which reads git history: task state is
          # influenced by Task-Status trailers and fix marks resolve against commits. On the
          # default depth-1 clone that index is DEGRADED, and it said so out loud the first
          # time -- "39 fix mark(s) name a commit that is not in this history", and 186 live
          # references where the real backlog has 166. It failed safe, checking more than
          # exists rather than less, but a later check in this job that trusted the same index
          # would not be so lucky.
          fetch-depth: 0
      - name: Scripts parse
        run: bash -n tooling/*.sh tooling/commit-msg templates/*.sh
      - name: Exec bits survive a fresh clone
        run: |
          set -eu
          bad=$(git ls-files -s tooling/ templates/*.sh |
                awk '$1!="100755" && $4!="tooling/schema.sql" {print $4}')
          if [ -n "$bad" ]; then
            echo "not executable in the git index (they would not run on Linux):" >&2
            echo "$bad" >&2
            exit 1
          fi
      - name: Structure
        run: python3 validate.py

      # The conformance suite proves the CONTROL works, on a fixture. This asks it of THIS
      # repository's own backlog, which is the question that goes red when someone writes a
      # dependency in prose tomorrow. docs/DEPENDENCIES.md audited 273 of them by hand once;
      # without this step the audit decays from the first task filed after it.
      - name: Every prose task reference is declared
        run: |
          set -eu
          command -v sqlite3 >/dev/null || sudo apt-get -qq update && sudo apt-get -qq install -y sqlite3
          bash tooling/kit-index.sh >/dev/null
          bash tooling/kit-plan.sh --check-refs

  # The kit was built and tested on Windows through 0.5.1. Running one deterministic
  # fixture on a second platform is what found 0.5.2's timestamp defect -- neither platform
  # alone showed anything wrong, only the diff between them did. This keeps that property
  # proven rather than true-once. macOS is here because it ships bash 3.2, far older than
  # anything else the kit runs on.
  #
  # windows-latest is here because it is the platform the suite is WRITTEN on and the one
  # platform no CI leg could ever go red on. T-20260808-the-conformance-suite-cannot-fail-on-the
  # AC3 says in as many words that if CI is the only possible answer, that answer changes the
  # workflow rather than the code. Twenty-eight commits once shipped green locally and failed
  # macos-latest; the reverse direction has never had a check at all.
  #
  # It was deliberately NOT in branch protection while it was expected to go red -- both that
  # task and T-20260808-the-conformance-suite-shipped-two-gnu-on record portability defects
  # shipping inside the SUITE'S OWN test code. It went green on 2026-09-17 at 139 passed / 0
  # failed and was PROMOTED TO REQUIRED on 2026-09-18. A red leg now blocks merges, which is the
  # point; removing the context from protection is the escape hatch.
  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash          # windows-latest defaults to pwsh; every step below is POSIX shell
    steps:
      # Must precede checkout. autocrlf converts as the working tree is WRITTEN, so checking
      # out first and configuring after leaves the files already rewritten -- and the suite's
      # CRLF steps assert on bytes exactly as committed.
      - name: Keep line endings exactly as committed
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # The Windows arm of this step once reported SUCCESS with no sqlite3 on the box:
      # `choco install` met a 504 from the community feed, printed "installed 0/0 packages"
      # and still EXITED 0, so the `||` never fired and 43 steps later failed on
      # "sqlite3: command not found". An install step that cannot fail is not an install step.
      # Hence a retry for the transient case, a feed-independent fallback for the sustained
      # one, and a verification that is the real gate -- green here now means sqlite3
      # answered, not that a package manager said something reassuring.
      - name: Install sqlite3
        run: |
          set -eu
          if command -v apt-get >/dev/null; then
            sudo apt-get -qq update && sudo apt-get -qq install -y sqlite3
          elif [ "$RUNNER_OS" = Windows ]; then
            for attempt in 1 2 3; do
              if command -v sqlite3 >/dev/null 2>&1; then break; fi
              echo "sqlite3 absent, choco attempt $attempt"
              choco install sqlite -y --no-progress || true
              hash -r 2>/dev/null || true
            done
            if ! command -v sqlite3 >/dev/null 2>&1; then
              echo "choco did not produce sqlite3; falling back to sqlite.org"
              page=$(curl -fsSL https://sqlite.org/download.html)
              rel=$(printf '%s' "$page" | grep -oE '[0-9]{4}/sqlite-tools-win-x64-[0-9]+[.]zip' | head -1)
              if [ -z "$rel" ]; then echo "could not locate a win-x64 tools build"; exit 1; fi
              curl -fsSL -o /tmp/sqlite-tools.zip "https://sqlite.org/$rel"
              unzip -q -o /tmp/sqlite-tools.zip -d /tmp/sqlite-tools
              exe=$(find /tmp/sqlite-tools -name sqlite3.exe -print -quit)
              if [ -z "$exe" ]; then echo "no sqlite3.exe in the archive"; exit 1; fi
              dir=$(dirname "$exe")
              cygpath -w "$dir" >> "$GITHUB_PATH"
              PATH="$dir:$PATH"
              export PATH
            fi
          else
            sqlite3 --version || brew install sqlite
          fi
          # The gate. Absent this the step is decorative, which is how it passed last time.
          if ! command -v sqlite3 >/dev/null 2>&1; then
            echo "FATAL: sqlite3 is not on PATH after the install step"
            exit 1
          fi
          echo "sqlite3 $(sqlite3 --version)"

      # T-20260822 AC1, verbatim: "The same benchmark is run on one other machine. If it reports
      # 10-30 ms this is a fault worth pursuing; if it reports ~800 ms it is the hardware and the
      # design-around is permanent. One data point cannot tell those apart." The dev machine
      # reports 1,015 ms/spawn. This runner is that second machine, and this is the same
      # benchmark -- PowerShell, not bash, because `cmd //c exit` from bash still pays bash's
      # own fork and so cannot distinguish msys from system-wide. That method error is recorded
      # in the task. It must never fail the job: a measurement that can redden a gate stops
      # being run.
      - name: Measure process spawn latency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sw=[Diagnostics.Stopwatch]::StartNew()
          for($i=0;$i -lt 50;$i++){ Start-Process cmd.exe -ArgumentList '/c','exit' -NoNewWindow -Wait }
          $sw.Stop()
          "{0:N0} ms per spawn  (dev machine 1,015 ms | healthy 10-30 ms)" -f ($sw.Elapsed.TotalMilliseconds/50)

      # THE SECOND AWK IS THE CONTROL, NOT A CONVENIENCE. `conformance (ubuntu-latest)` stayed
      # green through four core dumps of kit-index.sh on this same runner, in this same workflow,
      # because the suite ran under exactly ONE awk -- whatever `/usr/bin/awk` happens to be --
      # and mawk tolerates the construct that crashed it. Measured 2026-09-20 against the pre-fix
      # tree: the defect FAILS under gawk at THREE task files and PASSES under mawk at 224.
      # Fixture size was never the variable; which awk runs is.
      #
      # Without this step the multi-awk conformance step SKIPs, is counted as NOT EXERCISED, and
      # the blindness comes back quietly.
      #
      # WHICH LEG ACTUALLY CARRIES THE COVERAGE, measured rather than assumed: ubuntu-latest ships
      # gawk 5.2.1, and gawk 5.2.1 is the ONLY awk verified to catch this defect. gawk 5.3.2 passes
      # it on both Linux and Windows, and the Windows runner was green on the pre-fix tree while
      # running gawk 5.4.1. So the ubuntu leg is the control here; macOS adds breadth whose effect
      # on THIS defect is untested, because no container image carries 5.4.1 to check it against.
      #
      # WINDOWS IS A PROBE, NOT A PROMISE. Git Bash ships one awk, so the step skipped there. busybox
      # is tried because its applet is a fourth implementation and the platform that was blind
      # deserves more than one. It is `|| true` on purpose: this is the first attempt at it, a
      # chocolatey outage must not redden a required check, and the conformance step reports SKIP
      # and counts it as NOT EXERCISED when the probe does not produce a second implementation.
      #
      # NO NEW CHECK NAME, DELIBERATELY. This is a step inside the existing `conformance` job, so
      # branch protection's five required contexts are untouched. Adding a matrix leg would have
      # created a sixth name that protection does not require, and renaming any existing one
      # locks `main` until the protection rule is edited by hand.
      - name: Install a second awk implementation
        run: |
          set -eu
          if command -v apt-get >/dev/null; then
            sudo apt-get -qq install -y gawk original-awk
          elif [ "$RUNNER_OS" = macOS ]; then
            brew list gawk >/dev/null 2>&1 || brew install gawk
          elif [ "$RUNNER_OS" = Windows ]; then
            choco install busybox -y --no-progress || true
            hash -r 2>/dev/null || true
          fi
          # busybox needs its own branch: its awk is an APPLET, so `busybox -W version` prints
          # "-W: applet not found" and exits 127. Under `set -eu` that killed this step outright,
          # and had it survived, that string is unique and would have counted as a distinct
          # implementation -- inflating the total with an awk that was never run.
          bf=$(mktemp); : > "$bf"
          for c in awk gawk mawk original-awk nawk busybox; do
            p=$(command -v "$c" 2>/dev/null) || continue
            if [ "$c" = busybox ]; then
              if "$p" awk 'BEGIN{exit 0}' >/dev/null 2>&1; then
                raw=$("$p" 2>&1 || true); b=$(printf %s "$raw" | sed -n 1p)
              else
                echo "  $c -> $p -- present but no awk applet, not counted"
                continue
              fi
            else
              raw=$( { "$p" --version 2>/dev/null || "$p" -W version 2>&1 || true; } ); b=$(printf %s "$raw" | sed -n 1p)
            fi
            [ -n "$b" ] || b="unknown-$c"
            echo "  $c -> $p -- $b"
            echo "$b" >> "$bf"
          done
          n=$(sort -u "$bf" | grep -c . || true)
          [ -n "$n" ] || n=0
          rm -f "$bf"
          echo "distinct awk implementations on PATH: $n"
          # The gate, and it is the whole point. On the two platforms where a second
          # implementation is expected, absence is a broken install rather than a platform fact.
          # A decorative install step is exactly how sqlite3 once went missing with the job green.
          if [ "$RUNNER_OS" != Windows ] && [ "$n" -lt 2 ]; then
            echo "FATAL: expected a second awk implementation on $RUNNER_OS, found $n"
            exit 1
          fi

      - name: Conformance
        run: |
          set -eu
          WORK="${RUNNER_TEMP}/fixture"
          # RUNNER_TEMP is a backslash path on Windows. git-bash does not translate it, so
          # every mkdir -p beneath it would create one literally-named directory, not a tree.
          if [ "$RUNNER_OS" = Windows ]; then
            WORK="$(cygpath -u "$RUNNER_TEMP")/fixture"
          fi
          start=$(date +%s)
          KIT="$PWD" WORK="$WORK" bash tests/conformance.sh
          echo "conformance wall clock: $(( $(date +%s) - start ))s on $RUNNER_OS"
