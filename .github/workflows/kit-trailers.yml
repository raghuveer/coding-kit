# The kit's own trailer gate.
#
# Adapted from templates/github-trailer-gate.yml, which checks out the kit at a pinned tag.
# This repository IS the kit, so it runs its own tooling from the checkout instead. That is
# the only difference; the contract is the same one every adopting project gets.
#
# WHAT THIS CANNOT SEE: on a squash-merge GitHub composes a new commit message at merge
# time from the PR title and body, editable in the merge dialog, and no CI run observes it
# before it lands. The push trigger is the mitigation -- it checks after the fact, so a bad
# squash turns main red immediately instead of quietly costing a task. Detection, not
# prevention.

# THE JOB NAMES BELOW ARE LOAD-BEARING. Branch protection on `main` requires these four checks
# by name -- `structure`, `trailers`, `conformance (ubuntu-latest)`, `conformance (macos-latest)`.
# A required check that never reports blocks every merge forever, so renaming a job, or changing
# the matrix so a leg reports under a different name, silently locks the branch until someone
# edits the protection rule to match. Rename here and there, in the same change, or not at all.
#
# The matrix names are composed by GitHub as `<job> (<matrix value>)` -- adding an OS adds a
# check that protection does not require, which is harmless; removing one leaves a required
# check with nothing to satisfy it, which is not.
#
# `conformance (windows-latest)` is the fifth check and is deliberately one of the harmless
# kind: reporting, not required. Promoting it to required is a separate decision, to be taken
# once it has been green for long enough to mean something. See the job comment below.

name: kit trailers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trailers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the merge base must be present, so no shallow clone

      - name: Validate commit trailers
        run: |
          set -eu
          if [ "${{ github.event_name }}" = pull_request ]; then
            RANGE='${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}'
          else
            BEFORE='${{ github.event.before }}'
            if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] \
               || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              RANGE='${{ github.sha }}~1..${{ github.sha }}'
            else
              RANGE="$BEFORE..${{ github.sha }}"
            fi
          fi
          echo "range: $RANGE"
          bash tooling/kit-trailers.sh range "$RANGE" --enforce

  # The kit's own verification ladder, from commands.* in .claude/project-profile.md.
  # Rungs 3 and 5 are declared unavailable there rather than faked, which raises the tier
  # instead of lowering the bar.
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The backlog check below runs kit-index.sh, which reads git history: task state is
          # influenced by Task-Status trailers and fix marks resolve against commits. On the
          # default depth-1 clone that index is DEGRADED, and it said so out loud the first
          # time -- "39 fix mark(s) name a commit that is not in this history", and 186 live
          # references where the real backlog has 166. It failed safe, checking more than
          # exists rather than less, but a later check in this job that trusted the same index
          # would not be so lucky.
          fetch-depth: 0
      - name: Scripts parse
        run: bash -n tooling/*.sh tooling/commit-msg templates/*.sh
      - name: Exec bits survive a fresh clone
        run: |
          set -eu
          bad=$(git ls-files -s tooling/ templates/*.sh |
                awk '$1!="100755" && $4!="tooling/schema.sql" {print $4}')
          if [ -n "$bad" ]; then
            echo "not executable in the git index (they would not run on Linux):" >&2
            echo "$bad" >&2
            exit 1
          fi
      - name: Structure
        run: python3 validate.py

      # The conformance suite proves the CONTROL works, on a fixture. This asks it of THIS
      # repository's own backlog, which is the question that goes red when someone writes a
      # dependency in prose tomorrow. docs/DEPENDENCIES.md audited 273 of them by hand once;
      # without this step the audit decays from the first task filed after it.
      - name: Every prose task reference is declared
        run: |
          set -eu
          command -v sqlite3 >/dev/null || sudo apt-get -qq update && sudo apt-get -qq install -y sqlite3
          bash tooling/kit-index.sh >/dev/null
          bash tooling/kit-plan.sh --check-refs

  # The kit was built and tested on Windows through 0.5.1. Running one deterministic
  # fixture on a second platform is what found 0.5.2's timestamp defect -- neither platform
  # alone showed anything wrong, only the diff between them did. This keeps that property
  # proven rather than true-once. macOS is here because it ships bash 3.2, far older than
  # anything else the kit runs on.
  #
  # windows-latest is here because it is the platform the suite is WRITTEN on and the one
  # platform no CI leg could ever go red on. T-20260808-the-conformance-suite-cannot-fail-on-the
  # AC3 says in as many words that if CI is the only possible answer, that answer changes the
  # workflow rather than the code. Twenty-eight commits once shipped green locally and failed
  # macos-latest; the reverse direction has never had a check at all.
  #
  # It is deliberately NOT added to branch protection. Both that task and
  # T-20260808-the-conformance-suite-shipped-two-gnu-on record portability defects shipping
  # inside the SUITE'S OWN test code, so this leg is expected to go red before it goes green,
  # and a required check that is red locks the branch for everyone.
  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash          # windows-latest defaults to pwsh; every step below is POSIX shell
    steps:
      # Must precede checkout. autocrlf converts as the working tree is WRITTEN, so checking
      # out first and configuring after leaves the files already rewritten -- and the suite's
      # CRLF steps assert on bytes exactly as committed.
      - name: Keep line endings exactly as committed
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Install sqlite3
        run: |
          if command -v apt-get >/dev/null; then
            sudo apt-get -qq update && sudo apt-get -qq install -y sqlite3
          elif [ "$RUNNER_OS" = Windows ]; then
            sqlite3 --version || choco install sqlite -y --no-progress
          else
            sqlite3 --version || brew install sqlite
          fi

      # T-20260822 AC1, verbatim: "The same benchmark is run on one other machine. If it reports
      # 10-30 ms this is a fault worth pursuing; if it reports ~800 ms it is the hardware and the
      # design-around is permanent. One data point cannot tell those apart." The dev machine
      # reports 1,015 ms/spawn. This runner is that second machine, and this is the same
      # benchmark -- PowerShell, not bash, because `cmd //c exit` from bash still pays bash's
      # own fork and so cannot distinguish msys from system-wide. That method error is recorded
      # in the task. It must never fail the job: a measurement that can redden a gate stops
      # being run.
      - name: Measure process spawn latency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sw=[Diagnostics.Stopwatch]::StartNew()
          for($i=0;$i -lt 50;$i++){ Start-Process cmd.exe -ArgumentList '/c','exit' -NoNewWindow -Wait }
          $sw.Stop()
          "{0:N0} ms per spawn  (dev machine 1,015 ms | healthy 10-30 ms)" -f ($sw.Elapsed.TotalMilliseconds/50)

      - name: Conformance
        run: |
          set -eu
          WORK="${RUNNER_TEMP}/fixture"
          # RUNNER_TEMP is a backslash path on Windows. git-bash does not translate it, so
          # every mkdir -p beneath it would create one literally-named directory, not a tree.
          if [ "$RUNNER_OS" = Windows ]; then
            WORK="$(cygpath -u "$RUNNER_TEMP")/fixture"
          fi
          start=$(date +%s)
          KIT="$PWD" WORK="$WORK" bash tests/conformance.sh
          echo "conformance wall clock: $(( $(date +%s) - start ))s on $RUNNER_OS"
